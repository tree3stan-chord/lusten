<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- High-res version for Apple touch icon -->
  <!-- Background with rounded corners for iOS -->
  <rect width="180" height="180" rx="40" fill="linear-gradient(135deg, #667eea 0%, #764ba2 100%)"/>
  
  <!-- First eighth note with hipster head -->
  <g id="note1">
    <!-- Stem -->
    <rect x="45" y="45" width="8" height="90" fill="#ffffff" rx="4"/>
    
    <!-- Quirky hipster note head -->
    <ellipse cx="39" cy="129" rx="22" ry="17" fill="#ffffff"/>
    <!-- Beard -->
    <path d="M17 129 C17 146 28 151 39 151 C50 151 61 146 61 129 Z" fill="#8b5cf6"/>
    <!-- Glasses frame -->
    <circle cx="31" cy="121" r="10" fill="none" stroke="#1f2937" stroke-width="4"/>
    <circle cx="47" cy="121" r="10" fill="none" stroke="#1f2937" stroke-width="4"/>
    <!-- Bridge -->
    <line x1="41" y1="121" x2="37" y2="121" stroke="#1f2937" stroke-width="3"/>
    <!-- Hipster mustache -->
    <path d="M28 124 Q39 122 50 124" stroke="#8b5cf6" stroke-width="4" fill="none"/>
  </g>

  <!-- Second eighth note with hipster head -->
  <g id="note2">
    <!-- Stem -->
    <rect x="126" y="34" width="8" height="101" fill="#ffffff" rx="4"/>
    
    <!-- Quirky hipster note head -->
    <ellipse cx="140" cy="129" rx="22" ry="17" fill="#ffffff"/>
    <!-- Trendy bow tie -->
    <path d="M120 135 L128 129 L136 135 L128 141 Z" fill="#ef4444"/>
    <path d="M144 135 L152 129 L160 135 L152 141 Z" fill="#ef4444"/>
    <rect x="136" y="132" width="8" height="6" fill="#1f2937"/>
    <!-- Monocle -->
    <circle cx="129" cy="121" r="11" fill="none" stroke="#1f2937" stroke-width="4"/>
    <line x1="118" y1="110" x2="112" y2="104" stroke="#1f2937" stroke-width="3"/>
    <!-- Fancy mustache -->
    <path d="M118 126 Q129 122 140 124 Q151 122 162 126" stroke="#10b981" stroke-width="5" fill="none"/>
  </g>

  <!-- Connecting beam -->
  <path d="M53 45 L126 34 L134 40 L59 51 Z" fill="#f8fafc"/>
  
  <!-- Musical flair -->
  <circle cx="84" cy="22" r="5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="96" cy="158" r="4" fill="#34d399" opacity="0.7"/>
</svg>